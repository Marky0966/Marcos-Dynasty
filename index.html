<!DOCTYPE html>
<html>
<head>
  <title>Political Dynasty sa Pilipinas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <main id="welcome" class="stage welcome" aria-label="Welcome">
    <canvas class="particles" id="pWelcome"></canvas>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="sunburst" aria-hidden="true"></div>
    <div class="seal" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="grain" aria-hidden="true"></div>
    <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i>
    <i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>

    <div class="welcome-content">
      <p class="eyebrow fade-in">Presentasyon</p>
      <h1 class="title" id="welcomeTitle">Welcome</h1>
      <div class="divider"></div>
      <p class="subtitle">Political Dynasty sa Pilipinas</p>
      <div class="presenter">
        <span>Inihanda ng</span>
        <strong>Group One</strong>
      </div>
    </div>

  </main>


  <section id="treeStage" class="stage tree-stage" aria-label="Family tree ng pamilya Marcos">
    <canvas class="particles" id="pTree"></canvas>
    <div class="sunburst sb-tree" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="tree-head">
      <button class="back" id="backBtn" type="button" aria-label="Bumalik sa Welcome">
        <span aria-hidden="true">←</span>
      </button>
      <p class="eyebrow">Political Dynasty sa Pilipinas</p>
      <h2>Pamilya <span>Marcos</span></h2>
      <div class="head-rule" aria-hidden="true"><i></i></div>
    </header>

    <div class="tree-wrap">
      <div class="tree-inner" id="treeInner">
        <svg class="links" id="links" aria-hidden="true"></svg>
        <div id="tree"></div>
      </div>
    </div>

  </section>


  <div class="profile" id="profile" role="dialog" aria-modal="true" aria-labelledby="pName" aria-hidden="true">
    <div class="pf-bg" id="pfBgA"></div>
    <div class="pf-bg" id="pfBgB"></div>
    <div class="grain pf-grain" aria-hidden="true"></div>
    <div class="pf-ghost" id="pfGhost" aria-hidden="true"></div>

    <button class="pf-close" id="pClose" type="button" aria-label="Isara">&times;</button>

    <div class="pf-stage" id="pfStage">
      <div class="pf-side" id="pfSide">
        <div class="pf-face" id="pfFace">
          <div class="pf-rings" aria-hidden="true"><i class="pf-rays"></i><i class="ring r1"></i><i class="ring r2"></i></div>
          <div class="pf-av" id="pfAv"></div>
        </div>
        <span class="pf-badge" id="pfBadge"></span>
      </div>

      <div class="pf-info" id="pfInfo">
        <p class="eyebrow" id="pfRelation"></p>
        <h3 class="pf-name" id="pName"></h3>
        <p class="pf-role" id="pfRole"></p>
        <p class="pf-years" id="pfYears"></p>
        <div class="pf-rule"></div>
        <ul class="pf-facts" id="pfFacts"></ul>
      </div>
    </div>

    <nav class="pf-nav" id="pfNav" aria-label="Mga miyembro ng pamilya">
      <button type="button" class="pf-arrow" id="pPrev" aria-label="Nakaraan">&larr;</button>
      <div class="pf-dots" id="pfDots"></div>
      <button type="button" class="pf-arrow" id="pNext" aria-label="Susunod">&rarr;</button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
